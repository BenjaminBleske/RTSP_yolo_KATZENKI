<!DOCTYPE html>
<html lang="de" class="h-full scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocky & Scratchy Live Cam 🐾</title>

  <!-- Tailwind CSS v3 via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            purplecat: '#a78bfa',
            pinkcat: '#f472b6',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons für Sun/Moon -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .gallery-img { transition: all 0.3s ease; }
    .gallery-img:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 dark:from-gray-900 dark:to-gray-800 text-gray-900 dark:text-gray-100 transition-all duration-500">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow-xl">
    <div class="max-w-7xl mx-auto px-6 py-8 flex justify-between items-center">
      <h1 class="text-4xl font-bold text-purple-700 dark:text-purple-400">
        Rocky & Scratchy Live Cam 🐾
      </h1>
      <button id="theme-toggle" class="p-3 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
        <i data-lucide="moon" class="w-6 h-6 hidden dark:block"></i>
        <i data-lucide="sun" class="w-6 h-6 block dark:hidden"></i>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 grid gap-10 lg:grid-cols-3">

    <!-- Live Stream -->
    <section class="lg:col-span-2">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden">
        <h2 class="text-2xl font-semibold px-8 pt-6 pb-4">Live-Stream</h2>
        <div class="relative bg-black">
          <img 
            src="/video_feed" 
            alt="Live Video Stream" 
            class="w-full h-auto mx-auto block rounded-b-2xl"
            onload="this.style.opacity=1"
            style="opacity:0; transition: opacity 1s;"
          />
        </div>
      </div>
    </section>

    <!-- Stats Cards -->
    <section class="grid gap-6">
      <h2 class="text-3xl font-semibold text-center lg:text-left">Erkennungen (letzte 24h)</h2>
      <div id="stats-container" class="grid gap-6">
        <div class="text-center text-gray-500">Lade Statistiken…</div>
      </div>
    </section>

    <!-- Galerie Tabs -->
    <section class="lg:col-span-3">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8">
        <h2 class="text-3xl font-semibold mb-8 text-center">Galerie der letzten Erkennungen</h2>

        <div class="flex flex-wrap justify-center gap-4 mb-10" role="tablist">
          <button class="tab-btn px-8 py-4 rounded-xl font-medium text-lg transition bg-purple-600 text-white active" data-tab="rocky_n">Rocky Nacht</button>
          <button class="tab-btn px-8 py-4 rounded-xl font-medium text-lg transition" data-tab="rocky_t">Rocky Tag</button>
          <button class="tab-btn px-8 py-4 rounded-xl font-medium text-lg transition" data-tab="scratchy_n">Scratchy Nacht</button>
          <button class="tab-btn px-8 py-4 rounded-xl font-medium text-lg transition" data-tab="scratchy_t">Scratchy Tag</button>
        </div>

        <div id="gallery-container" class="min-h-96">
          <p class="text-center text-gray-500 py-20">Wähle eine Katze oben aus</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Dark Mode Toggle
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }
    toggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
    });
    lucide.createIcons();

    // WICHTIG: Alle Pfade sind jetzt relativ → funktionieren immer!
    const API_BASE = '';

    const classes = ['rocky_n', 'rocky_t', 'scratchy_n', 'scratchy_t'];
    const classNames = {
      rocky_n: 'Rocky Nacht',
      rocky_t: 'Rocky Tag',
      scratchy_n: 'Scratchy Nacht',
      scratchy_t: 'Scratchy Tag'
    };

    // Stats laden
    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        const stats = await res.json();
        const container = document.getElementById('stats-container');
        container.innerHTML = classes.map(cls => `
          <div class="bg-gradient-to-br from-purplecat to-pinkcat p-6 rounded-2xl text-white shadow-lg">
            <h3 class="text-xl font-bold mb-2">${classNames[cls]}</h3>
            <p class="text-4xl font-extrabold">${stats[cls]?.count_24h || 0}</p>
            <p class="text-sm opacity-90 mt-2">Zuletzt: ${stats[cls]?.last_seen || '–'}</p>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('stats-container').innerHTML = '<p class="text-red-500">Fehler beim Laden der Stats</p>';
      }
    }

    // Galerie laden
    async function loadGallery(label) {
      try {
        const res = await fetch(`${API_BASE}/gallery_count/${label}`);
        const { count } = await res.json();
        const container = document.getElementById('gallery-container');
        if (count === 0) {
          container.innerHTML = '<p class="text-center text-gray-500 py-20">Noch keine Bilder für diese Klasse</p>';
          return;
        }
        container.innerHTML = `
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
            ${Array.from({length: count}, (_, i) => `
              <div class="relative group">
                <img src="${API_BASE}/gallery_image/${label}/${i}?t=${Date.now()}" 
                     alt="${label} ${i+1}" 
                     class="w-full h-48 object-cover rounded-xl shadow-lg gallery-img">
                <a href="${API_BASE}/download_image/${label}/${i}" 
                   download 
                   class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg text-sm font-medium opacity-0 group-hover:opacity-100 transition">
                   Download
                </a>
              </div>
            `).join('')}
          </div>
        `;
      } catch (e) {
        container.innerHTML = '<p class="text-red-500">Fehler beim Laden der Galerie</p>';
      }
    }

    // Tab-Wechsel
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-purple-600', 'text-white'));
        btn.classList.add('active', 'bg-purple-600', 'text-white');
        loadGallery(btn.dataset.tab);
      });
    });

    // Initial laden
    loadStats();
    setInterval(loadStats, 20000);
    document.querySelector('.tab-btn').click(); // Ersten Tab aktivieren
  </script>
</body>
</html>
